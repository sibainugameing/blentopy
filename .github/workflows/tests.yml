name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: blentopy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run unit tests
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q src tests examples

  blender-integration:
    name: Blender 4.2 headless render integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libxrender1 libxi6 libxkbcommon0 libsm6 libxext6 libxxf86vm1
      - name: Download Blender 4.2.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENTOPY_BLENDER=$RUNNER_TEMP/blender-4.2.0-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Install blentopy
        run: python -m pip install -e .
      - name: Render a real scene with Blender
        shell: bash
        run: |
          mkdir -p renders
          blentopy render tests/fixtures/ci_smoke_scene.py \
            --blender "$BLENTOPY_BLENDER" \
            --output renders/ci-smoke.mp4 \
            --blend-output renders/ci-smoke.blend \
            --workspace tests/fixtures \
            --width 256 --height 256 --fps 2 --duration 1 --timeout 600
          test -s renders/ci-smoke.mp4
          test -s renders/ci-smoke.blend
      - name: Upload Blender integration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2-integration-output
          path: |
            renders/ci-smoke.mp4
            renders/ci-smoke.blend
          if-no-files-found: error
          retention-days: 7
